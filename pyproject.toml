[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "own-chrome"
version = "0.4.0"
description = "Agent CLI for the Chrome already open, plus a Typer LinkedIn command."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Misha Lubich" }]
keywords = ["chrome", "cdp", "linkedin", "cli", "agents"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/own-chrome"
Repository = "https://github.com/ml-lubich/own-chrome"
Issues = "https://github.com/ml-lubich/own-chrome/issues"

[project.scripts]
own-chrome = "own_chrome.cli:main"
li = "own_chrome.linkedin:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/own_chrome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
